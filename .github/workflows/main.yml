name: Build Expo APK
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Required to allow the workflow to create a GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      # Automatically injects the GitHub run number into app.json
      - name: Set Dynamic App Version
        run: |
          jq '.expo.version = "3.0.${{ github.run_number }}"' app.json > tmp.json && mv tmp.json app.json

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_SKIP_CLEANUP: 1
          _JAVA_OPTIONS: "-Xmx4096m -XX:MaxMetaspaceSize=2048m"
        # development
        # run: eas build --platform android --profile development --local --non-interactive
        # production
        run: eas build --platform android --profile production --local --non-interactive

      # Uploads the built APK and creates a release tag matching the app.json version
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          tag_name: "3.0.${{ github.run_number }}"
          name: "The Watcher Build #${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Broadcast update notification to all devices via Expo Push API
      - name: Broadcast App Update Push Notification
        if: success()
        run: |
          curl -s -X POST "https://watcher-api-rho.vercel.app/api/notify-update" \
            -H "Content-Type: application/json" \
            -H "x-notify-secret: ${{ secrets.NOTIFY_SECRET }}" \
            -d '{
              "version": "3.0.${{ github.run_number }}",
              "releaseName": "The Watcher Build #${{ github.run_number }}",
              "apkUrl": "https://github.com/${{ github.repository }}/releases/tag/3.0.${{ github.run_number }}"
            }'

