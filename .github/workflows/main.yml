name: Build Expo APK
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    
# Required to allow the workflow to create a GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          
      - name: Install dependencies
        run: npm install
        
      # Automatically injects the GitHub run number into app.json
      - name: Set Dynamic App Version
        run: |
          jq '.expo.version = "3.0.${{ github.run_number }}"' app.json > tmp.json && mv tmp.json app.json
          
      - name: Build APK
        env:
          EAS_LOCAL_BUILD_SKIP_CLEANUP: 1
          _JAVA_OPTIONS: "-Xmx4096m -XX:MaxMetaspaceSize=2048m"
        run: eas build --platform android --profile development --local --non-interactive
        
      # Uploads the built APK and creates a release tag matching the app.json version
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          tag_name: "3.0.${{ github.run_number }}"
          name: "The Watcher Build #${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}